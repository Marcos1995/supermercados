<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Supermercados</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --green: #18E667;
    --ink: #032612;
    --forest: #0A3D22;
    --muted: #4F6E5A;
    --line: #CCE0D3;
    --panel: #F8FAF9;
    --card: #ffffff;
    --map-h: 100dvh;
    --sheet-peek: 48%;
    --panel-w: 360px;
  }
  html.dark {
    --panel: #112117;
    --card: #173026;
    --ink: #e7f6ec;
    --muted: #b7d4c4;
    --line: #1c3a2c;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Public Sans", sans-serif;
    color: var(--ink);
    background: var(--panel);
    -webkit-font-smoothing: antialiased;
  }
  .material-symbols-outlined {
    font-family: "Material Symbols Outlined";
    font-weight: normal; font-style: normal; font-size: 20px; line-height: 1;
    display: inline-block; white-space: nowrap;
  }
  a.go, button.go {
    background: #18E667 !important; color: #032612 !important; font-weight: 700 !important;
    border: 0; border-radius: 0.75rem; padding: 0.5rem 0.85rem; font-size: 0.75rem;
    text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.25rem;
  }
  .tema {
    position: relative; width: 3.4rem; height: 1.8rem;
    border: 1px solid var(--forest); border-radius: 999px; background: #EAF7EE; padding: 0; cursor: pointer;
  }
  html.dark .tema { background: #1c3a2c; }
  .tema .material-symbols-outlined { position: absolute; top: 50%; transform: translateY(-50%); font-size: 16px; color: #032612; }
  html.dark .tema .material-symbols-outlined { color: #e7f6ec; }
  .tema .sun { left: 3px; } .tema .moon { right: 3px; }
  .tema-thumb {
    position: absolute; top: 2px; left: 2px; width: 1.45rem; height: 1.45rem;
    border-radius: 999px; background: #18E667; border: 1px solid #032612; z-index: 1;
    transition: left .2s ease;
  }
  html.dark .tema-thumb { left: calc(100% - 1.45rem - 2px); }
  :focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; }
  .name-jump { background: none; border: 0; padding: 0; font: inherit; font-weight: 900; color: inherit; cursor: pointer; text-align: left; }
  .is-on { box-shadow: inset 0 0 0 2px #18E667; }

  #app { position: relative; width: 100%; height: 100dvh; overflow: hidden; }
  #mapa {
    position: absolute; inset: 0; z-index: 0;
    background: #e7efe9;
  }
  .leaflet-container { font-family: inherit; width: 100%; height: 100%; }
  .leaflet-popup-content { margin: 10px 12px; }

  #float-bar {
    position: absolute; top: max(0.75rem, env(safe-area-inset-top));
    left: 0.75rem; right: 0.75rem; z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    pointer-events: none;
  }
  #float-bar > * { pointer-events: auto; }
  .brand-pill {
    display: flex; align-items: center; gap: 0.5rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 1rem;
    padding: 0.4rem 0.75rem 0.4rem 0.45rem;
    box-shadow: 0 4px 16px rgba(3, 38, 18, 0.12);
  }
  .brand-pill .ico {
    width: 2rem; height: 2rem; border-radius: 0.7rem;
    background: rgba(24, 230, 103, 0.25); color: var(--forest);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-pill strong { font-size: 0.9rem; font-weight: 900; letter-spacing: -0.02em; }

  #map-tools {
    position: absolute; right: 0.75rem; bottom: calc(var(--sheet-peek) + 0.75rem);
    z-index: 25; display: flex; flex-direction: column; gap: 0.4rem;
    transition: bottom .25s ease;
  }
  #app.panel-collapsed #map-tools { bottom: 4.5rem; }
  .map-fab {
    width: 2.75rem; height: 2.75rem; border-radius: 0.85rem;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    box-shadow: 0 4px 14px rgba(3, 38, 18, 0.14);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .map-fab:active { transform: scale(0.96); }

  #panel {
    position: absolute; z-index: 20;
    left: 0; right: 0; bottom: 0;
    height: var(--sheet-peek); max-height: 88dvh;
    background: var(--panel);
    border-radius: 1.25rem 1.25rem 0 0;
    border: 1px solid var(--line);
    border-bottom: 0;
    box-shadow: 0 -8px 28px rgba(3, 38, 18, 0.14);
    display: flex; flex-direction: column;
    transition: height .28s ease, transform .28s ease;
  }
  #app.panel-collapsed #panel { height: 3.5rem; }
  #panel-handle {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
    padding: 0.45rem 0.75rem 0.25rem; cursor: pointer; user-select: none;
    border: 0; background: transparent; color: inherit; width: 100%;
  }
  #panel-handle .grip {
    width: 2.5rem; height: 0.28rem; border-radius: 99px; background: #94a89c; margin-bottom: 0.35rem;
  }
  #panel-handle .row {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
  }
  #panel-handle .title { font-weight: 900; font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  #panel-body {
    flex: 1 1 auto; overflow: auto; padding: 0 0.85rem 1.25rem;
    -webkit-overflow-scrolling: touch;
  }
  #app.panel-collapsed #panel-body { display: none; }

  .kpi {
    background: #18E667; color: #032612; border-radius: 1rem; padding: 0.85rem 1rem; margin-bottom: 0.75rem;
  }
  .kpi .tag { font-size: 0.65rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.85; }
  .kpi .n { font-size: 1.75rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; margin-top: 0.15rem; }
  .kpi .cap { font-size: 0.7rem; font-weight: 600; margin-top: 0.35rem; line-height: 1.35; color: #032612; }

  .block { background: var(--card); border: 1px solid var(--line); border-radius: 1rem; padding: 0.75rem; margin-bottom: 0.65rem; }
  .block h2 {
    margin: 0 0 0.5rem; font-size: 0.7rem; font-weight: 900; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted);
  }
  #semanal-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.3rem 0.55rem; max-height: 9.5rem; overflow: auto;
  }
  #semanal-grid label {
    display: flex; align-items: flex-start; gap: 0.35rem;
    font-size: 0.72rem; line-height: 1.25; font-weight: 600; color: var(--muted);
  }
  .seg {
    display: flex; padding: 0.2rem; background: #EEF5F0; border: 1px solid var(--line); border-radius: 0.75rem;
  }
  html.dark .seg { background: #0c1a12; }
  .seg button {
    flex: 1; border: 0; background: transparent; cursor: pointer;
    padding: 0.45rem 0.35rem; font-size: 0.7rem; font-weight: 600; color: var(--muted);
    border-radius: 0.55rem; line-height: 1.2;
  }
  .seg button[aria-pressed="true"] {
    background: #fff; color: #0A3D22; font-weight: 900; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  html.dark .seg button[aria-pressed="true"] { background: #fff; color: #0A3D22; }
  .btn-main {
    width: 100%; margin-top: 0.55rem; border: 0; border-radius: 0.85rem;
    padding: 0.7rem 0.75rem; font-size: 0.8rem; font-weight: 900;
    background: #0A3D22; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 0.35rem;
  }
  .btn-main:disabled { opacity: 0.55; cursor: wait; }
  .linkish {
    background: none; border: 0; padding: 0; font: inherit; font-size: 0.7rem; font-weight: 700;
    color: var(--forest); cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }
  html.dark .linkish { color: #18E667; }
  #estado { font-size: 0.7rem; font-weight: 600; color: var(--muted); margin: 0.35rem 0 0; }
  #cuenta { font-size: 0.7rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 0.45rem; }
  #lista { display: flex; flex-direction: column; gap: 0.55rem; }
  .store-row {
    background: var(--card); border: 1px solid var(--line); border-radius: 1rem;
    padding: 0.75rem; display: flex; flex-direction: column; gap: 0.55rem;
  }
  .store-row.best { border: 2px solid #18E667; }
  .store-row h3 { margin: 0; font-size: 0.95rem; font-weight: 900; }
  .store-row .meta { margin: 0.15rem 0 0; font-size: 0.7rem; color: var(--muted); }
  .store-row ul { margin: 0.35rem 0 0; padding: 0; list-style: none; }
  .store-row li { font-size: 0.7rem; line-height: 1.3; color: var(--muted); word-break: break-word; }
  .store-row li.miss { font-weight: 700; color: var(--forest); }
  html.dark .store-row li.miss { color: #18E667; }
  .store-acts { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .thumb {
    width: 2.5rem; height: 2.5rem; border-radius: 0.65rem; object-fit: cover;
    border: 1px solid var(--line); flex-shrink: 0; background: #EAF7EE;
  }
  .row-top { display: flex; gap: 0.55rem; align-items: flex-start; min-width: 0; }
  .row-top .body { min-width: 0; flex: 1; }
  #nota { font-size: 0.65rem; color: var(--muted); margin: 0.5rem 0 0; line-height: 1.4; }
  .ficha { background: var(--card); border: 1px solid var(--line); border-radius: 0.85rem; margin-bottom: 0.4rem; }
  .ficha summary {
    cursor: pointer; list-style: none; padding: 0.65rem 0.75rem;
    font-weight: 900; font-size: 0.8rem;
  }
  .ficha summary::-webkit-details-marker { display: none; }
  .hit-scroll { max-height: 10rem; overflow: auto; padding: 0 0.75rem 0.65rem; }
  .hit-scroll p { margin: 0 0 0.25rem; font-size: 0.7rem; line-height: 1.3; word-break: break-word; color: var(--muted); }
  .hit-scroll p.miss { font-weight: 700; color: var(--forest); }
  html.dark .hit-scroll p.miss { color: #18E667; }
  .map-only-badge {
    display: inline-block; font-size: 0.65rem; font-weight: 800;
    padding: 0.15rem 0.45rem; border-radius: 999px; background: #EAF7EE; color: #0A3D22;
  }
  html.dark .map-only-badge { background: #1c3a2c; color: #c9ecd6; }

  @media (min-width: 768px) {
    #float-bar { left: calc(var(--panel-w) + 1rem); right: 1rem; }
    #app.panel-collapsed #float-bar { left: 4.25rem; }
    #map-tools {
      bottom: 1rem; right: 1rem;
    }
    #app.panel-collapsed #map-tools { bottom: 1rem; }
    #panel {
      top: 0; bottom: 0; left: 0; right: auto;
      width: var(--panel-w); height: 100% !important;
      border-radius: 0; border: 0; border-right: 1px solid var(--line);
      box-shadow: 6px 0 24px rgba(3, 38, 18, 0.1);
      transition: width .28s ease, transform .28s ease;
    }
    #app.panel-collapsed #panel { width: 3.25rem; }
    #panel-handle { padding: 0.85rem 0.65rem 0.35rem; cursor: pointer; }
    #panel-handle .grip { display: none; }
    #app.panel-collapsed #panel-handle .title,
    #app.panel-collapsed #estado-mini { writing-mode: vertical-rl; transform: rotate(180deg); }
    #app.panel-collapsed #panel-body { display: none; }
    #semanal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: 11rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    #panel, .tema-thumb, #map-tools { transition: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="mapa" role="region" aria-label="Mapa de supermercados"></div>

  <div id="float-bar">
    <div class="brand-pill">
      <span class="ico"><span class="material-symbols-outlined">shopping_basket</span></span>
      <strong>Supermercados</strong>
    </div>
    <button id="tema" class="tema" type="button" role="switch" aria-checked="false" aria-label="Tema claro u oscuro">
      <span class="material-symbols-outlined sun" aria-hidden="true">sunny</span>
      <span class="material-symbols-outlined moon" aria-hidden="true">dark_mode</span>
      <span class="tema-thumb"></span>
    </button>
  </div>

  <div id="map-tools">
    <button type="button" class="map-fab" id="btn-locate" title="Mi ubicación" aria-label="Mi ubicación">
      <span class="material-symbols-outlined">my_location</span>
    </button>
    <button type="button" class="map-fab" id="btn-map-center" title="Usar centro del mapa" aria-label="Usar centro del mapa">
      <span class="material-symbols-outlined">pin_drop</span>
    </button>
  </div>

  <aside id="panel" aria-label="Panel de filtros y resultados">
    <button type="button" id="panel-handle" aria-expanded="true" aria-controls="panel-body">
      <span class="grip" aria-hidden="true"></span>
      <span class="row">
        <span class="title">Compra · mapa</span>
        <span id="estado-mini" class="title" style="font-weight:600;text-transform:none;letter-spacing:0"></span>
        <span class="material-symbols-outlined" id="panel-chevron" aria-hidden="true">expand_more</span>
      </span>
    </button>
    <div id="panel-body">
      <div class="kpi">
        <div class="tag" id="hero-tag">Catálogo</div>
        <div class="n" id="hero-n">—</div>
        <div class="cap" id="hero-cap">Elige tipos de la lista semanal. Precios del catálogo online, no del lineal.</div>
      </div>
      <p id="hallazgo" style="margin:0 0 0.65rem;font-size:0.85rem;font-weight:800;line-height:1.3"></p>

      <div class="block">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;margin-bottom:0.35rem">
          <h2 style="margin:0">Compra semanal</h2>
          <span>
            <button type="button" class="linkish" id="todo-on">Todo</button>
            ·
            <button type="button" class="linkish" id="todo-off">Nada</button>
          </span>
        </div>
        <div id="semanal-grid" aria-label="Tipos de la compra semanal"></div>
        <div class="seg" id="brand-selector" style="margin-top:0.55rem">
          <button type="button" id="opt-cualquier" aria-pressed="true">Cualquier marca</button>
          <button type="button" id="opt-blanca" aria-pressed="false">Solo marca blanca</button>
        </div>
        <button type="button" class="btn-main" id="buscar">
          <span class="material-symbols-outlined" style="font-size:16px">refresh</span>
          <span>Actualizar</span>
        </button>
        <p id="estado">Cargando…</p>
      </div>

      <div class="block">
        <h2 id="cuenta">Supermercados</h2>
        <div id="lista"></div>
        <p id="nota"></p>
      </div>

      <div id="fichas" aria-label="Qué eligió cada cadena"></div>
    </div>
  </aside>
</div>

<script>
const STOP = new Set(["de","la","el","los","las","un","una","y","con","en","del","al","para"]);
const OWN = {
  mercadona: ["hacendado","deliplus","bosque verde","compy"],
  carrefour: ["carrefour","simpl"],
  lidl: ["milbona","alesto","freshona","dulano","nixe","sondey","crownfield","chef select","freeway","cien","deluxe"],
  aldi: ["milsani","grandessa","lacura","tandil"]
};
const WEB = {
  mercadona: "https://www.mercadona.es",
  carrefour: "https://www.carrefour.es",
  lidl: "https://www.lidl.es",
  aldi: "https://www.aldi.es",
  dia: "https://www.dia.es",
  alcampo: "https://www.alcampo.es",
  eroski: "https://www.eroski.es",
  consum: "https://www.consum.es",
  ahorramas: "https://www.ahorramas.com",
  bonpreu: "https://www.bonpreu.cat",
  caprabo: "https://www.caprabo.com",
  condis: "https://www.condis.es",
  coviran: "https://www.coviran.es",
  hipercor: "https://www.hipercor.es",
  supercor: "https://www.supercor.es",
  elcorteingles: "https://www.elcorteingles.es",
  bm: "https://www.bmsupermercados.com",
  familycash: "https://www.familycash.es",
  gadis: "https://www.gadis.es",
  mas: "https://www.supermercadosmas.com",
  froiz: "https://www.froiz.com",
  hiperusera: "https://www.hiperusera.com",
  alimerka: "https://www.alimerka.es",
  lupa: "https://www.supermercadoslupa.com",
  simply: "https://www.simply.es",
  supeco: "https://www.supeco.es",
  spar: "https://www.spar.es",
  eurospar: "https://www.spar.es"
};
const CHAIN_ALIASES = [
  ["el corte ingles", "elcorteingles"],
  ["elcorteingles", "elcorteingles"],
  ["family cash", "familycash"],
  ["familycash", "familycash"],
  ["hiper usera", "hiperusera"],
  ["hiperusera", "hiperusera"],
  ["carrefour express", "carrefour"],
  ["carrefour market", "carrefour"],
  ["carrefour", "carrefour"],
  ["mercadona", "mercadona"],
  ["hipercor", "hipercor"],
  ["supercor", "supercor"],
  ["alcampo", "alcampo"],
  ["eroski", "eroski"],
  ["consum", "consum"],
  ["ahorramas", "ahorramas"],
  ["ahorra mas", "ahorramas"],
  ["bonpreu", "bonpreu"],
  ["caprabo", "caprabo"],
  ["condis", "condis"],
  ["coviran", "coviran"],
  ["gadis", "gadis"],
  ["alimerka", "alimerka"],
  ["eurospar", "eurospar"],
  ["simply", "simply"],
  ["supeco", "supeco"],
  ["froiz", "froiz"],
  ["aldi", "aldi"],
  ["lidl", "lidl"],
  ["spar", "spar"],
  ["lupa", "lupa"],
  ["dia & go", "dia"],
  ["dia go", "dia"],
  ["dia", "dia"],
  [" bm ", "bm"],
  ["mas ", "mas"]
];
const $ = (id) => document.getElementById(id);
const fold = (s) => (s || "").normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
const eur = (n) => Number(n).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " \u20ac";
const kmf = (n) => n.toLocaleString("es-ES", { maximumFractionDigits: 1 }) + " km";

function tokens(q) {
  return fold(q).split(/[^a-z0-9]+/).filter((t) => t.length > 2 && !STOP.has(t));
}
function matches(name, toks) {
  const n = fold(name);
  return toks.length > 0 && toks.every((t) => {
    if (n.includes(t)) return true;
    const stem = t.endsWith("es") ? t.slice(0, -2) : t.endsWith("s") ? t.slice(0, -1) : t;
    return stem.length > 3 && n.includes(stem);
  });
}
function isOwn(p, chain) {
  const b = " " + fold(p.brand + " " + p.name) + " ";
  return (OWN[chain] || []).some((w) => b.includes(w));
}
function chainOf(name, brand) {
  const n = " " + fold((brand || "") + " " + (name || "")) + " ";
  for (const [alias, key] of CHAIN_ALIASES) {
    if (n.includes(alias)) return key;
  }
  return "";
}
function siteFor(chain, explicit) {
  if (explicit && /^https?:\/\//i.test(explicit)) return explicit;
  return WEB[chain] || "";
}
function dist(a, b, c, d) {
  const R = 6371, p = Math.PI / 180, x = (c - a) * p, y = (d - b) * p;
  const h = Math.sin(x / 2) ** 2 + Math.cos(a * p) * Math.cos(c * p) * Math.sin(y / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
function mercaWh(lat, lon) {
  if (lat > 41 && lon > 0.3) return "bcn1";
  if (lat > 38.2 && lat < 40.3 && lon > -1.3 && lon < 0.7) return "vlc1";
  if (lat < 38.6 && lon < -3) return "svq1";
  return "mad3";
}
function aldiRegion(lat, lon) {
  if (lat < 29.5) return "can";
  if (lat > 38.6 && lat < 40.2 && lon > 1) return "bal";
  return "pen";
}
function warehouseKey(lat, lon) {
  return mercaWh(lat, lon) + "-" + aldiRegion(lat, lon);
}
function shopCell(lat, lon) {
  return lat.toFixed(3) + ":" + lon.toFixed(3);
}
function dayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

const SEMANAL = [
  "aceite de oliva", "aceite de girasol", "huevos", "leche", "pan", "mantequilla", "yogurt", "queso",
  "jamón", "pollo", "carne picada", "arroz", "pasta", "legumbres", "azúcar", "café", "agua",
  "detergente", "lavavajillas", "papel de cocina", "papel higiénico", "jabón", "champú",

const IDB_NAME = "supermercados-cache";
const IDB_STORE = "kv";
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const r = tx.objectStore(IDB_STORE).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  } catch (e) { return undefined; }
}
async function idbPut(key, value) {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* ignore */ }
}

    if (am !== bm) return am - bm;
    if (ai && bi && a.basket.total !== b.basket.total) return a.basket.total - b.basket.total;
    return (a.km || 0) - (b.km || 0);

async function jget(url, headers) {
  const r = await fetch(url, { headers: Object.assign({ Accept: "application/json" }, headers || {}) });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
async function jpost(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
function dedupe(list) {
  const seen = new Set();
  const out = [];
  for (const p of list) {
    if (!(p.price > 0) || !p.name) continue;
    const k = fold(p.name) + "|" + p.price;
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(p);
    if (out.length >= 100) break;
  }
  return out;
}
async function collect(load) {
  const acc = [];
  for (let page = 0; page < 3; page++) {
    let batch, done;
    try {
      const r = await load(page);
      batch = r.items;
      done = r.done;
    } catch (e) {
      if (!acc.length) throw e;
      break;
    }
    acc.push(...batch);
    if (done || acc.length >= 100) break;
  }
  return dedupe(acc);
}

async function loadShops(lat, lon) {
  const q = `[out:json][timeout:12];(node["shop"="supermarket"](around:8000,${lat},${lon});way["shop"="supermarket"](around:8000,${lat},${lon}););out center tags 120;`;
  const urls = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.openstreetmap.fr/api/interpreter"
  ];
  let d = null;
  for (const url of urls) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 7000);
    try {
      const r = await fetch(url, { method: "POST", body: q, signal: ctrl.signal });
      if (r.ok) { d = await r.json(); break; }
    } catch (e) { /* siguiente espejo */ }
    finally { clearTimeout(timer); ctrl.abort(); }
  }
  if (!d) throw new Error("overpass");
  const all = (d.elements || []).map((el) => {
    const lat2 = el.lat || (el.center && el.center.lat);
    const lon2 = el.lon || (el.center && el.center.lon);
    const t = el.tags || {};
    const chain = chainOf(t.name, t.brand);
    return {
      id: (el.type || "n") + el.id,
      name: t.name || t.brand || "Supermercado",
      lat: lat2, lon: lon2, chain,
      web: siteFor(chain, t.website || t["contact:website"] || ""),
      km: dist(lat, lon, lat2, lon2)
    };
  }).filter((s) => Number.isFinite(s.lat) && s.km <= 8).sort((a, b) => a.km - b.km);
  const capped = all.slice(0, 50);
  const have = new Set(capped.map((s) => s.chain).filter(Boolean));
  all.forEach((s) => {
    if (s.chain && !have.has(s.chain)) { capped.push(s); have.add(s.chain); }
  });
  return capped;
}

function queriesFor(line) {
  const main = QUERY[line] || line;
  return [...new Set([main, line, ...(FALLBACKS[line] || [])])];

async function searchLineMerged(chain, line, lat, lon) {

  for (const q of queriesFor(line)) {

      if (seen.has(k)) continue;
      seen.add(k);
      out.push(h);
      if (out.length >= 100) return out;
    }
  }
  return out;
}

  lines.forEach((line) => {
    CHAINS.forEach((chain) => {
      jobs.push({ chain, line });
    });
  });
  const limit = 8;
  for (let i = 0; i < jobs.length; i += limit) {
    await Promise.all(jobs.slice(i, i + limit).map(({ chain, line }) =>
      searchLineMerged(chain, line, lat, lon).then((hits) => { cats[chain][line] = hits; }).catch(() => {
        cats[chain][line] = [];
        if (!fail.includes(LABEL[chain])) fail.push(LABEL[chain]);
      })
    ));
  }
  return cats;
}
function blancaOn() {
  return $("opt-blanca").getAttribute("aria-pressed") === "true";
}
const NOISE = [
  "corporal","cabello","facial","bronceador","masaje","utensilio","espumador","chocolate","nidos",
  "codorniz","claras","liquida","flan","clipsaurio","juguete","dinosaur","silvercrest","cebador",
  "cazo","freidora","maquina","robot","sarten","croquetas","perro","gato","helado","tagliatelle",
  "helado","bombones","calendario","guirnalda","aspirador","tapicer","cafetera","batidora","mancuerna"
];
function noisy(name, toks) {
  const n = fold(name);
  return NOISE.some((w) => n.includes(w) && !toks.some((t) => t.includes(w) || w.includes(t)));
}
function wordsOf(name) {
  return fold(name).split(/[^a-z0-9]+/).filter(Boolean);
}
function hitWord(w, t) {
  return w === t || (t.length > 3 && w.startsWith(t)) || (w.length > 3 && t.startsWith(w));
}
function primaryOk(name, toks) {
  if (!toks.length) return false;
  const words = wordsOf(name);
  const primary = toks[0];
  const idx = words.findIndex((w) => hitWord(w, primary));
  if (idx < 0 || idx > 3) return false;
  return toks.every((t) => words.some((w) => hitWord(w, t)));
}
function matchToks(line) {
  if (line === "yogurt") return ["yogur"];
  if (line === "verdura") return ["lechuga"];
  if (line === "legumbres") return ["garbanzos"];
  if (line === "fruta") return ["manzana"];
  if (line === "carne picada") return ["picada"];
  return tokens(line);
}
function lineBan(name, line) {
  const n = fold(name);
  if (line === "leche") {
    if (/(leche|bebida) de (coco|almendra|soja|avena|arroz|avellana)/.test(n)) return true;
    if (/(solar|corporal|crema|limpiador|friegasuelos|fermentada|condensada|evaporada)/.test(n)) return true;
  }
  if (line === "arroz" && /(arroz con|croqueta|perro|gato)/.test(n)) return true;
  if (line === "huevos" && /(chocolate|flan|pasta|tagliatelle)/.test(n)) return true;
  if (line === "aceite de oliva") {
    if (!/aceite de oliva/.test(n)) return true;
    if (/(atun|sardina|sardinillas|pota|bonito|ventresca)/.test(n)) return true;
  }
  if (line === "aceite de girasol") {
    if (!/aceite de girasol/.test(n)) return true;
    if (/(atun|sardina|sardinillas|pota|bonito|ventresca)/.test(n)) return true;
  }
  if (line === "carne picada") {
    if (/(cebolla|chocolate|avellana|girasoli)/.test(n)) return true;
    if (!/(vacuno|cerdo|pollo|pavo|ternera|burger meat|carne|mixto)/.test(n)) return true;
  }
  if (line === "jamón" && /(jamoncitos|croqueta|pavo|york|cocido de pavo)/.test(n)) return true;
  if (line === "pan" && /(panettone|empanado)/.test(n)) return true;
  if (line === "pollo" && /(croqueta|nugget|crispies|perro|gato|caldo|sopa|stock|curry|empanado|relleno|pate|paté)/.test(n)) return true;
  if (line === "lavavajillas" && /(sal para|abrillantador)/.test(n)) return true;
  if (line === "jabón" && /(dispensador|vaso|organizador|jabonera)/.test(n)) return true;
  if (line === "azúcar" && !/^azucar\b/.test(n)) return true;
  if (line === "fruta" && /(friegasuelos|limpiador|ambientador|gel|jabon|champu|zumo|smoothie)/.test(n)) return true;
  if (line === "patatas" && /(fritas|chips|snack|congelad|bacon|gajo|especiad|queso|american|cocidas)/.test(n)) return true;
  if (line === "tomate" && /(frito|salsa|ketchup|concentrado|triturado|fideos|troceado|pelado|siciliana)/.test(n)) return true;
  if (line === "café" && /(cappuccino|capuccino|helado|bombon|con leche|puleva|latte)/.test(n)) return true;
  if (line === "papel de cocina" && /(vegetal|horno|aluminio)/.test(n)) return true;
  return false;
}
function visibleHits(list, blanca, chain, line) {
  const toks = matchToks(line);
  return (list || []).filter((p) =>
    p.price > 0 &&
    matches(p.name, toks) &&
    primaryOk(p.name, toks) &&
    !noisy(p.name, toks) &&
    !lineBan(p.name, line) &&
    (!blanca || isOwn(p, chain))
  );
}
function normUnit(value, raw) {
  const u = fold(raw);
  if (u.includes("100-ml") || u.includes("100 ml") || u.includes("100ml")) return { family: "l", value: value * 10 };
  if (u === "l" || u.includes("litro")) return { family: "l", value: value };
  if (u.includes("100-g") || u.includes("100 g") || u.includes("100g")) return { family: "kg", value: value * 10 };
  if (u === "kg" || u.includes("kilo")) return { family: "kg", value: value };
  if (u === "dz" || u === "dc" || u.includes("docena")) return { family: "dz", value: value };
  return { family: "pack", value: value };
}
function pick(list, query, blanca, chain) {
  const toks = matchToks(query);
  let hits = visibleHits(list, blanca, chain, query);
  if (!hits.length) return null;
  const lead = hits.filter((p) => toks.some((t) => fold(p.name).startsWith(t)));
  if (lead.length) hits = lead;
  hits.forEach((p) => {
    const n = normUnit(p.unit, p.unitRaw);
    p.family = n.family;
    p.cmp = n.value;
  });
  const want = EXPECT[query];
  const order = want ? [want, "l", "kg", "dz", "ud", "pack"] : ["l", "kg", "dz", "ud", "pack"];
  const counts = {};
  hits.forEach((p) => { counts[p.family] = (counts[p.family] || 0) + 1; });
  let fam = order.find((f) => hits.some((p) => p.family === f));
  if (!fam) {
    fam = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || order.indexOf(a) - order.indexOf(b))[0] || "pack";
  }
  let pool = hits.filter((p) => p.family === fam);
  if (query === "pan") {
    const bread = pool.filter((p) => !fold(p.name).includes("rallado"));
    if (bread.length) pool = bread;
  }
  pool.sort((a, b) => a.cmp - b.cmp || a.price - b.price);
  return pool[0] || null;
}

function paintSemanal() {
  const box = $("semanal-grid");
  box.replaceChildren();
  SEMANAL.forEach((line) => {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selected.has(line);
    cb.addEventListener("change", () => {
      if (cb.checked) selected.add(line);
      else selected.delete(line);
      if (catalogs) {
        linesNow = selectedLines();
        redraw();
      }
    });
    const span = document.createElement("span");
    span.textContent = line.charAt(0).toUpperCase() + line.slice(1);
    label.append(cb, span);
    box.appendChild(label);
  });
}
function paintFichas(lines) {
  const box = $("fichas");
  box.replaceChildren();
  if (!catalogs || !lines.length) return;
  const blanca = blancaOn();
  const head = document.createElement("h2");
  head.style.cssText = "font-size:0.7rem;font-weight:900;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin:0.75rem 0 0.45rem";
  head.textContent = "Producto a producto";
  box.appendChild(head);
  const rows = lines.map((line) => {
    const picks = {};
    let ok = 0;
    CHAINS.forEach((chain) => {
      const p = pick((catalogs[chain] && catalogs[chain][line]) || [], line, blanca, chain);
      picks[chain] = p;
      if (p) ok += 1;
    });
    return { line, picks, ok };
  });
  rows.sort((a, b) => b.ok - a.ok || a.line.localeCompare(b.line, "es"));
  rows.forEach(({ line, picks, ok }) => {
    const det = document.createElement("details");
    det.className = "ficha";
    const sum = document.createElement("summary");
    sum.textContent = line.charAt(0).toUpperCase() + line.slice(1) + " · " + ok + "/4 cadenas";
    const scroll = document.createElement("div");
    scroll.className = "hit-scroll";
    CHAINS.forEach((chain) => {
      const p = picks[chain];
      const row = document.createElement("p");
      row.className = p ? "" : "miss";
      row.textContent = p
        ? LABEL[chain] + " · " + p.name + " · " + eur(p.price) + (p.unitLabel ? " · " + p.unitLabel : "")
        : LABEL[chain] + " · no trae " + line;
      scroll.appendChild(row);
    });
    det.append(sum, scroll);
    box.appendChild(det);
  });
}
function basketOf(cats, lines, blanca) {
  const out = {};
  CHAINS.forEach((chain) => {
    const items = [];
    const missing = [];
    lines.forEach((line) => {
      const p = pick((cats[chain] && cats[chain][line]) || [], line, blanca, chain);
      if (p) items.push(p);
      else missing.push(line);
    });
    out[chain] = { items, missing, unmarked: [], total: items.reduce((sum, p) => sum + p.price, 0) };
  });
  return out;
}
function attach(shops, cats, lines, blanca, lat, lon) {
  const chosen = basketOf(cats, lines, blanca);
  const placed = shops.map((s) => ({ ...s, basket: chosen[s.chain] || null }));
  const present = new Set(placed.map((s) => s.chain));
  const extra = CHAINS.filter((k) => chosen[k] && !present.has(k)).map((k) => ({
    id: "chain-" + k, name: LABEL[k], chain: k, web: WEB[k],
    lat, lon, km: 0, basket: chosen[k], catalogOnly: true
  }));
  return placed.concat(extra);
}

function redraw() {
  if (!catalogs || !here || !linesNow.length) {
    if (catalogs && here && shopsNow.length) {
      paint(attach(shopsNow, catalogs, [], blancaOn(), here.lat, here.lon), []);
    }
    return;
  }
  paintFichas(linesNow);
  paint(attach(shopsNow, catalogs, linesNow, blancaOn(), here.lat, here.lon), linesNow);
}

async function getCatalogsCached(lat, lon, fail) {
  const key = catalogsCacheKey(lat, lon);
  const hit = await idbGet(key);
  if (hit && hit.day === dayKey() && hit.data) {
    cacheFromDay = true;
    return hit.data;
  }
  setEstado("Descargando catálogos (una vez al día)…");
  cacheFromDay = false;
  const cats = await searchCatalogs(SEMANAL, lat, lon, fail);
  await idbPut(key, { day: dayKey(), wh: warehouseKey(lat, lon), data: cats, ts: Date.now() });
  return cats;
}
async function getShopsCached(lat, lon) {
  const key = shopsCacheKey(lat, lon);
  const hit = await idbGet(key);
  if (hit && hit.day === dayKey() && hit.data) return hit.data;
  const shops = await loadShops(lat, lon);
  await idbPut(key, { day: dayKey(), cell: shopCell(lat, lon), data: shops, ts: Date.now() });
  return shops;
}

async function reloadShopsOnly() {
  if (!catalogs || !here) return;
  setEstado("Actualizando el mapa…");
  try {
    shopsNow = await getShopsCached(here.lat, here.lon);
    linesNow = selectedLines();
    paintFichas(linesNow);
    paint(attach(shopsNow, catalogs, linesNow, blancaOn(), here.lat, here.lon), linesNow);
    setEstado((cacheFromDay ? "Precios de hoy (caché) · " : "") + here.note + " · " + shopsNow.length + " súpers");
  } catch (e) {
    setEstado("No se ha podido leer el mapa.");
  }
}

async function buscar() {
  const lines = selectedLines();
  if (!lines.length) { setEstado("Marca al menos un tipo de la lista."); return; }
  $("buscar").disabled = true;
  setEstado("Preparando…");
  try {
    if (!here) here = await locate();
    const fail = [];
    const [shops, cats] = await Promise.all([
      getShopsCached(here.lat, here.lon).catch(() => { fail.push("mapa"); return []; }),
      getCatalogsCached(here.lat, here.lon, fail)
    ]);
    linesNow = lines;
    shopsNow = shops;
    catalogs = cats;
    paintFichas(lines);
    paint(attach(shops, catalogs, lines, blancaOn(), here.lat, here.lon), lines);
    const src = cacheFromDay ? "Precios de hoy (caché)" : "Precios nuevos de hoy";
    setEstado(src + " · " + here.note + (fail.length ? " · sin " + fail.join(", ") : ""));
  } catch (e) {
    $("hallazgo").textContent = "No se han podido leer los catálogos";
    $("hero-n").textContent = "Sin dato";
    setEstado("Fallo de red.");
  }
  $("buscar").disabled = false;
}

function pointFromUrl() {
  const params = new URLSearchParams(location.search);
  if (params.get("lat") && params.get("lon")) {
    return { lat: +params.get("lat"), lon: +params.get("lon"), note: "Punto de la dirección", accuracy: 0 };
  }
  return null;
}
function locate() {
  const fromUrl = pointFromUrl();
  if (fromUrl) return Promise.resolve(fromUrl);
  return new Promise((res) => {
    if (!navigator.geolocation) {
      res({ lat: 40.4168, lon: -3.7038, note: "Sin GPS: Madrid centro", accuracy: 0 });
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (p) => res({
        lat: p.coords.latitude,
        lon: p.coords.longitude,
        note: "Tu ubicación",
        accuracy: p.coords.accuracy || 0
      }),
      () => res({ lat: 40.4168, lon: -3.7038, note: "Sin GPS: Madrid centro", accuracy: 0 }),
      { enableHighAccuracy: true, timeout: 14000, maximumAge: 0 }
    );
  });
}

async function applyLocation(pos, opts) {
  const forceShops = opts && opts.forceShops;
  const prevWh = here ? warehouseKey(here.lat, here.lon) : null;
  const prevCell = here ? shopCell(here.lat, here.lon) : null;
  const nextWh = warehouseKey(pos.lat, pos.lon);
  const nextCell = shopCell(pos.lat, pos.lon);
  here = pos;
  if (!catalogs) {
    await buscar();
    return;
  }
  if (prevWh !== nextWh) {
    await buscar();
    return;
  }
  if (forceShops || prevCell !== nextCell) {
    await reloadShopsOnly();
    return;
  }
  setYou(here.lat, here.lon, here.accuracy);
  setEstado((cacheFromDay ? "Precios de hoy (caché) · " : "") + here.note);
}

function togglePanel() {
  const app = $("app");
  const collapsed = app.classList.toggle("panel-collapsed");
  $("panel-handle").setAttribute("aria-expanded", collapsed ? "false" : "true");
  $("panel-chevron").textContent = collapsed ? "expand_less" : "expand_more";
  try { sessionStorage.setItem("panel", collapsed ? "0" : "1"); } catch (e) {}
  setTimeout(() => { if (map) map.invalidateSize(); }, 300);
}

document.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("tema");
  const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.classList.toggle("dark", dark);
  $("tema").setAttribute("aria-checked", dark ? "true" : "false");
  $("tema").addEventListener("click", () => {
    const on = !document.documentElement.classList.contains("dark");
    document.documentElement.classList.toggle("dark", on);
    localStorage.setItem("tema", on ? "dark" : "light");
    $("tema").setAttribute("aria-checked", on ? "true" : "false");
  });

  try {
    if (sessionStorage.getItem("panel") === "0") {
      $("app").classList.add("panel-collapsed");
      $("panel-handle").setAttribute("aria-expanded", "false");
      $("panel-chevron").textContent = "expand_less";
    }
  } catch (e) {}

  $("panel-handle").addEventListener("click", togglePanel);

  const a = $("opt-cualquier"), b = $("opt-blanca");
  function mark(on) {
    a.setAttribute("aria-pressed", on ? "false" : "true");
    b.setAttribute("aria-pressed", on ? "true" : "false");
  }
  a.addEventListener("click", () => { mark(false); redraw(); });
  b.addEventListener("click", () => { mark(true); redraw(); });
  $("todo-on").addEventListener("click", () => {
    selected = new Set(SEMANAL);
    paintSemanal();
    if (catalogs) { linesNow = selectedLines(); redraw(); }
  });
  $("todo-off").addEventListener("click", () => {
    selected = new Set();
    paintSemanal();
    linesNow = [];
    if (catalogs) redraw();
  });
  $("buscar").addEventListener("click", buscar);

  $("btn-locate").addEventListener("click", async () => {
    setEstado("Localizando…");
    const pos = await locate();
    await applyLocation(pos, { forceShops: true });
    if (map) map.setView([pos.lat, pos.lon], 15);
  });
  $("btn-map-center").addEventListener("click", async () => {
    if (!map) return;
    const c = map.getCenter();
    await applyLocation({ lat: c.lat, lon: c.lng, note: "Centro del mapa", accuracy: 0 }, { forceShops: true });
  });

  paintSemanal();
  $("hallazgo").textContent = "Comparando supermercados cerca de ti";
  setEstado("Cargando mapa y precios…");

  here = pointFromUrl() || { lat: 40.4168, lon: -3.7038, note: "Sin GPS: Madrid centro", accuracy: 0 };
  ensureMap(here.lat, here.lon);
  setYou(here.lat, here.lon, here.accuracy);
  setTimeout(() => { if (map) map.invalidateSize(); }, 100);

  buscar().then(() => {
    if (!pointFromUrl() && navigator.geolocation) {
      locate().then((pos) => applyLocation(pos));
    }
  });
});
</script>
